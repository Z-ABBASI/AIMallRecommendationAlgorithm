services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  api:
    build: ./api
    ports:
      - "8000:8000"
    depends_on:
      - db

  web:
    build: ./web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  dbdata: